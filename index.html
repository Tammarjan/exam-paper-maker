<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b68"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css"><title>Exam Paper Maker</title></head>
<body><header><img src="icons/icon.svg" alt=""><div><b>Exam Paper Maker</b><small>Paper creation made simple</small></div></header>
<main><section id="home"><div class="hero"><h1>Create exam papers easily</h1><p>Works offline after first load. Papers stay on this device.</p><button id="new">＋ New paper</button></div><h2>Your saved papers</h2><div id="saved"></div><button id="export">Export backup</button><button id="import">Import backup</button><input id="backup" type="file" accept="application/json" hidden></section>
<section id="editor" hidden><button id="back">← Back</button><h2>Paper details</h2><form id="details"><label>School<input id="school"></label><label>Exam title<input id="exam" required></label><div class="two"><label>Class<input id="class" required></label><label>Subject<input id="subject" required></label></div><div class="two"><label>Total marks<input id="total" type="number" min="1" required></label><label>Time allowed<input id="time"></label></div><div class="two"><label>Date<input id="date" type="date"></label><label>Language<select id="lang"><option value="en">English LTR</option><option value="ur">Urdu RTL</option><option value="sd">Sindhi RTL</option></select></label></div><label>Instructions<textarea id="instructions"></textarea></label><button class="primary">Continue</button></form></section>
<section id="questions" hidden><button id="backDetails">← Back</button><h2>Questions</h2><div id="summary"></div><div id="list"></div><div class="panel"><h3>Add question</h3><label>Type<select id="type"><option value="short">Short question</option><option value="long">Long question</option><option value="mcq">MCQ</option><option value="blank">Fill blanks</option><option value="truefalse">True / False</option><option value="match">Match columns</option><option value="complete">Complete sentence</option><option value="diagram">Diagram / picture</option></select></label><label>Question<textarea id="text" rows="3"></textarea></label><label id="optionsLabel" hidden>Options (one per line)<textarea id="options"></textarea></label><div class="two"><label>Marks<input id="marks" type="number" min="0" step=".5" value="1"></label><label>Label<input id="label" placeholder="(a)"></label></div><button id="add" class="primary">Add question</button></div><p>Calculated marks: <b id="calculated">0</b></p><button id="preview">Preview paper</button></section>
<section id="preview" hidden><button id="backQuestions">← Back</button><h2>Preview</h2><button id="print">Print / Save PDF</button><button id="save">Save paper</button><article id="paper" class="paper"></article></section></main><nav><button id="homeNav">Home</button></nav><div id="toast"></div><script src="app.js"></script></body></html>
